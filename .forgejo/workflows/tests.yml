name: tests

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Home Assistant n'est volontairement pas installé : la suite ne teste que
      # la logique pure (schedule.py), ce qui garde le workflow rapide et sans
      # version de HA épinglée.
      - name: Installer pytest et ruff
        run: pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest
